spring.application.name=library-spring

spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- Nuevo: configuración de JWT (ver security/JwtService.java) ---
# jwt.secret debe tener al menos 32 caracteres (256 bits) para HS256.
# En un proyecto real NUNCA se sube al repo tal cual: se inyecta por
# variable de entorno o un gestor de secretos.
jwt.secret=cambia-esta-clave-por-una-muy-larga-y-aleatoria-1234567890
# Duración del token en milisegundos (3600000 = 1 hora)
jwt.expiration-ms=3600000
